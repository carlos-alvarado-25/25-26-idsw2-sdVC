<div class="admin-container">
  <header class="page-header">
    <div class="breadcrumb">
      <a [routerLink]="['/home']">🏠 Inicio</a> / 
      <a [routerLink]="['/admin/grados']">🎓 Grados</a> / 
      <span>{{ isEditMode() ? '✏️ Editar' : '➕ Nuevo' }}</span>
    </div>
    <h1>{{ isEditMode() ? 'Editar Grado' : 'Crear Nuevo Grado' }}</h1>
  </header>

  <div class="form-card">
    <form [formGroup]="gradoForm" (ngSubmit)="onSubmit()" class="admin-form">
      <div class="form-group">
        <label for="codigo">Código del Grado</label>
        <input 
          type="text" 
          id="codigo" 
          formControlName="codigo" 
          placeholder="Ej: GINF"
          [class.is-invalid]="gradoForm.get('codigo')?.invalid && gradoForm.get('codigo')?.touched"
        >
        <small class="hint" *ngIf="!isEditMode()">Identificador único (máx. 20 caracteres).</small>
      </div>

      <div class="form-group">
        <label for="nombre">Nombre Completo</label>
        <input 
          type="text" 
          id="nombre" 
          formControlName="nombre" 
          placeholder="Ej: Grado en Ingeniería Informática"
          [class.is-invalid]="gradoForm.get('nombre')?.invalid && gradoForm.get('nombre')?.touched"
        >
      </div>

      <div class="form-group">
        <label for="descripcion">Descripción</label>
        <textarea 
          id="descripcion" 
          formControlName="descripcion" 
          rows="4"
          placeholder="Breve descripción del grado académico..."
        ></textarea>
      </div>

      <div *ngIf="error()" class="error-alert">
        {{ error() }}
      </div>

      <div *ngIf="success()" class="success-alert">
        ✅ {{ isEditMode() ? 'Cambios guardados correctamente.' : 'Grado creado con éxito.' }}
      </div>

      <div class="form-actions">
        <button type="button" class="btn-secondary" [routerLink]="['/admin/grados']">
          {{ isEditMode() ? 'Finalizar' : 'Cancelar' }}
        </button>
        <button type="submit" class="btn-primary" [disabled]="gradoForm.invalid || loading() || (isEditMode() && gradoForm.pristine)">
          <span *ngIf="!loading()">{{ isEditMode() ? 'Guardar Cambios' : 'Guardar y Continuar' }}</span>
          <span *ngIf="loading()" class="loader"></span>
        </button>
      </div>
    </form>
  </div>
</div>
