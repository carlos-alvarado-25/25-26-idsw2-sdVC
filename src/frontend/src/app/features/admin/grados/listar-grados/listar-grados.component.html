<div class="admin-container">
  <header class="page-header">
    <div class="breadcrumb">
      <a [routerLink]="['/home']">🏠 Inicio</a> / <span>🎓 Grados</span>
    </div>
    <div class="header-main">
      <h1>Gestión de Grados</h1>
      <div class="actions">
        <button *ngIf="selectedIds().size > 0" class="btn-danger" (click)="eliminarSeleccionados()">
          🗑️ Eliminar ({{ selectedIds().size }})
        </button>
        <button class="btn-secondary" [routerLink]="['/admin/grados/importar']">📥 Importar</button>
        <button class="btn-primary" [routerLink]="['/admin/grados/crear']">➕ Nuevo Grado</button>
      </div>
    </div>
  </header>

  <section class="filters-section">
    <div class="search-box">
      <input 
        type="text" 
        [(ngModel)]="criterio" 
        (keyup.enter)="onSearch()"
        placeholder="Buscar por nombre o código..."
      >
      <button (click)="onSearch()" [disabled]="loading()">🔍</button>
    </div>
  </section>

  <div class="table-wrapper">
    <div *ngIf="loading()" class="table-overlay">
      <div class="loader"></div>
    </div>

    <table class="data-table">
      <thead>
        <tr>
          <th class="col-check">
            <input type="checkbox" [checked]="isAllSelected()" (change)="toggleSelectAll($event)">
          </th>
          <th>Código</th>
          <th>Nombre</th>
          <th>Descripción</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let grado of grados()" [class.selected]="selectedIds().has(grado.id)">
          <td class="col-check">
            <input type="checkbox" [checked]="selectedIds().has(grado.id)" (change)="toggleSelection(grado.id)">
          </td>
          <td class="font-mono">{{ grado.codigo }}</td>
          <td><strong>{{ grado.nombre }}</strong></td>
          <td class="text-muted">{{ grado.descripcion }}</td>
          <td class="table-actions">
            <button class="btn-icon" [routerLink]="['/admin/grados/editar', grado.id]" title="Editar">✏️</button>
            <button class="btn-icon delete" (click)="eliminarGrado(grado)" title="Eliminar">🗑️</button>
          </td>
        </tr>
        <tr *ngIf="grados().length === 0 && !loading()">
          <td colspan="5" class="no-data">No se encontraron grados registrados.</td>
        </tr>
      </tbody>
    </table>
  </div>

  <footer class="pagination">
    <div class="pagination-info">
      Mostrando {{ grados().length }} de {{ total() }} registros
    </div>
    <div class="pagination-controls">
      <button (click)="cambiarPagina(-1)" [disabled]="currentPage() === 1 || loading()">Anterior</button>
      <span class="page-number">{{ currentPage() }}</span>
      <button (click)="cambiarPagina(1)" [disabled]="grados().length < 10 || loading()">Siguiente</button>
    </div>
  </footer>
</div>
