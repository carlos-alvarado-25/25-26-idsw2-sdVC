<div class="auth-wrapper">
  <div class="login-card">
    <div class="login-header">
      <div class="logo-placeholder">📅</div>
      <h1>Davidario</h1>
      <p>Generador de Calendarios de Exámenes</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input 
          type="email" 
          id="email" 
          formControlName="email" 
          placeholder="ejemplo@idsw2.edu"
          [class.is-invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
        >
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          formControlName="password" 
          placeholder="••••••••"
          [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
        >
      </div>

      <div *ngIf="error" class="error-alert">
        {{ error }}
      </div>

      <button type="submit" [disabled]="loginForm.invalid || loading" class="btn-login">
        <span *ngIf="!loading">Acceder al Sistema</span>
        <span *ngIf="loading" class="loader"></span>
      </button>
    </form>

    <div class="login-footer">
      <p>&copy; 2026 Sistema de Gestión Académica</p>
    </div>
  </div>
</div>
